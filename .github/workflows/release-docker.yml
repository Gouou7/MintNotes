name: Release Docker image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: gouou7/mint-notes

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release commit from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve and validate release version
        id: release
        run: |
          version="$(node scripts/release-version.mjs "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build release
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: pnpm build

      - name: Test crypto Worker
        run: pnpm test:crypto-worker

      - name: Run API smoke test
        run: pnpm test:smoke

      - name: Validate Docker Compose
        run: docker compose config

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record release result
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "### Docker release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: $IMAGE_NAME:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platforms: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
